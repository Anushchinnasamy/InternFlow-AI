services:
  - type: web
    name: internflow-backend
    runtime: node
    plan: free
    # --include=dev is required here: NODE_ENV=production (set below) makes
    # `npm install` skip devDependencies by default, but typescript itself
    # and @types/* (needed to actually run `tsc`) live there. Without this,
    # the build fails with "implicitly has an 'any' type" errors on every
    # Express handler param, since @types/express never got installed.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: UPLOAD_DIR
        value: ./uploads
      # Secrets — filled in via the Render dashboard during setup, never
      # committed here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
