services:
  - type: web
    name: internflow-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: AI_MODEL
        value: gemini-3.6-flash
      - key: UPLOAD_DIR
        value: ./uploads
      # Secrets — filled in via the Render dashboard during setup, never
      # committed here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
